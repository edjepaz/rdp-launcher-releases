name: Build Windows executable

# Builds a portable Windows .exe bundle with PyInstaller plus a real
# installer (Setup.exe with Start Menu shortcut and uninstaller) via Inno Setup.
# - Runs automatically when app code changes on master
# - Run manually from the Actions tab any time ("Run workflow")
# - Publish a GitHub Release in this repo and both files are built, then
#   published to the PUBLIC edjepaz/rdp-launcher-releases repo, which is
#   what the app's self-updater reads (no auth needed).
#
# One-time setup ( Edd ): create the public repo, then add a fine-grained
# personal access token as the RELEASES_PAT secret in THIS repo's
# Settings -> Secrets and variables -> Actions. The token needs
# Contents: read+write on edjepaz/rdp-launcher-releases only.
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "**.py"
      - "requirements.txt"
      - "setup.iss"
      - ".github/workflows/build.yml"
  release:
    types: [published]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow

      - name: Stamp version
        shell: bash
        run: |
          VER="1.0.0"
          if [ "${{ github.event_name }}" = "release" ]; then VER="${{ github.event.release.tag_name }}"; VER="${VER#v}"; fi
          echo "APP_VERSION = \"$VER\"" > _version.py
          cat _version.py

      - name: Generate app icon
        shell: bash
        run: |
          python - <<'EOF'
          from PIL import Image, ImageDraw
          # Blue rounded square with a white monitor glyph, matching the app tile.
          S = 256
          img = Image.new("RGBA", (S, S), (0, 0, 0, 0))
          d = ImageDraw.Draw(img)
          d.rounded_rectangle([0, 0, S - 1, S - 1], radius=56, fill=(37, 99, 235, 255))
          d.rounded_rectangle([58, 70, 198, 158], radius=10,
                              outline=(255, 255, 255, 255), width=14)
          d.line([104, 158, 104, 184], fill=(255, 255, 255, 255), width=14)
          d.line([152, 158, 152, 184], fill=(255, 255, 255, 255), width=14)
          d.line([88, 188, 168, 188], fill=(255, 255, 255, 255), width=14)
          img.save("app.ico", sizes=[(16, 16), (32, 32), (48, 48),
                                     (64, 64), (128, 128), (256, 256)])
          print("app.ico written")
          EOF

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm --onedir --windowed --name "RDP Gateway Manager" --icon app.ico rdp_launcher.py

      - name: Zip the portable bundle
        run: Compress-Archive -Path "dist\RDP Gateway Manager\*" -DestinationPath "RDP-Gateway-Manager-windows.zip"

      - name: Build installer with Inno Setup
        run: |
          $ver = "1.0.0"
          if ("${{ github.event_name }}" -eq "release") { $ver = "${{ github.event.release.tag_name }}" -replace '^v', '' }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$ver" setup.iss
          Get-ChildItem dist-installer/*.exe

      - name: Upload portable bundle
        uses: actions/upload-artifact@v4
        with:
          name: RDP-Gateway-Manager-windows
          path: RDP-Gateway-Manager-windows.zip

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: RDP-Gateway-Manager-Setup
          path: dist-installer/*.exe

      - name: Publish to public releases repo
        if: github.event_name == 'release'
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name }}"
          printf '%s' "$RELEASE_BODY" > /tmp/notes.md
          SETUP=(dist-installer/RDP-Gateway-Manager-Setup-*.exe)
          if GH_TOKEN="$RELEASES_PAT" gh release view "$TAG" --repo edjepaz/rdp-launcher-releases >/dev/null 2>&1; then
            GH_TOKEN="$RELEASES_PAT" gh release upload "$TAG" RDP-Gateway-Manager-windows.zip "${SETUP[0]}" --clobber --repo edjepaz/rdp-launcher-releases
          else
            GH_TOKEN="$RELEASES_PAT" gh release create "$TAG" RDP-Gateway-Manager-windows.zip "${SETUP[0]}" --repo edjepaz/rdp-launcher-releases --title "$TAG" --notes-file /tmp/notes.md
          fi
        env:
          RELEASE_BODY: ${{ github.event.release.body }}
          RELEASES_PAT: ${{ secrets.RELEASES_PAT }}
